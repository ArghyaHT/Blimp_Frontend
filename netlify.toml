[build.environment]
  SECRETS_SCAN_ENABLED = "false"
  SECRETS_SCAN_OMIT_KEYS = "VITE_RAZORPAY_KEY"
  SECRETS_SCAN_OMIT_PATHS = ".env"

[[redirects]]
  from = "/campaign/:id/og-image.png"
  to = "/.netlify/functions/campaign-og-image?id=:id"
  status = 200
  force = true

[[redirects]]
  from = "/campaign/:id"
  to = "/.netlify/functions/campaign-meta?id=:id"
  status = 200
  force = true

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[functions]
  node_bundler = "esbuild"
  external_node_modules = ["sharp"]
  included_files = ["netlify/functions/fonts/**"]
